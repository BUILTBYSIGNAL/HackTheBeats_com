name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # the publish check needs nothing installed, so it runs first
      - name: Nothing private is published
        run: node tools/check-public.mjs
      - name: Install
        run: npm ci --ignore-scripts
      - name: Unit tests
        run: npm test
